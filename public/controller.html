<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Sridhar Rush — Controller</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>"/>
  <link rel="stylesheet" href="css/controller.css?v=15"/>
</head>
<body data-player="p0">
  <script>
    // controller page must never scroll/bounce on touch
    document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  </script>
  <div id="topbar">
    <div id="status-col">
      <div id="status" class="pill wait">Connecting…</div>
      <div id="room-tag"></div>
    </div>
    <div id="telemetry">
      <div id="speed"><span id="speed-val">0</span><small>km/h</small></div>
      <div id="nitro-wrap"><div id="nitro-fill"></div></div>
      <div id="lap-info"></div>
    </div>
    <div id="top-right">
      <div id="player-label" style="display:none">PLAYER 1</div>
      <button id="btn-full" class="tool" title="Fullscreen + landscape lock">⛶</button>
    </div>
  </div>

  <div id="pads" class="locked">
    <div class="stick-zone" id="zone-left">
      <div class="stick-base"><div class="stick-knob" id="knob-left"></div></div>
      <div class="stick-label">STEER</div>
    </div>

    <div id="buttons">
      <button id="btn-nitro" class="btn nitro">🔥 NITRO</button>
      <button id="btn-hb" class="btn big">DRIFT</button>
      <div class="btn-row">
        <button id="btn-gyro" class="btn sm">GYRO</button>
        <button id="btn-cam" class="btn sm">CAM</button>
        <button id="btn-reset" class="btn sm">RST</button>
        <button id="btn-horn" class="btn sm">HORN</button>
      </div>
    </div>

    <div class="stick-zone" id="zone-right">
      <div class="stick-base"><div class="stick-knob" id="knob-right"></div></div>
      <div class="stick-label">▲ GAS · BRAKE ▼</div>
    </div>
  </div>

  <div id="phone-banner"></div>

  <div id="join-screen" style="display:none">
    <div id="join-card">
      <h2>🕹️ JOIN A RACE</h2>
      <p>Enter the 5-letter room code shown on the laptop screen.</p>
      <input id="room-input" maxlength="5" placeholder="XXXXX" autocomplete="off" autocapitalize="characters"/>
      <button id="join-btn">JOIN</button>
      <p id="join-error"></p>
    </div>
  </div>

  <div id="full-note" style="display:none">
    <p>😕 Both joystick slots are taken (2 phones max).</p>
    <p>Ask a player to close their controller page, then reload this one.</p>
  </div>

  <div id="rotate-hint">🔄 Rotate your phone for the best layout</div>

  <script src="js/config.js"></script>
  <script src="js/net.js?v=15"></script>
  <script src="js/controller.js?v=15"></script>
</body>
</html>
