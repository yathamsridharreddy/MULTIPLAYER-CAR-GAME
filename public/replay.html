<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#05070c"/>
  <meta property="og:title" content="Sridhar Rush — Ghost Replay"/>
  <meta property="og:description" content="Watch a friend's lap, then open the game and beat their ghost."/>
  <meta property="og:image" content="https://sridhar-drift.vercel.app/img/og-card.png"/>
  <title>Sridhar Rush — Ghost Replay</title>
  <link rel="icon" href="img/logo.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700;800&display=swap"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #05070c; color: #e8ecf2; font-family: 'Rajdhani', 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
    #wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; background: radial-gradient(circle at 50% 40%, #0d1527 0%, #05070c 80%); }
    h1 { font: 900 18px 'Orbitron', sans-serif; letter-spacing: 2px; color: #ffffff; text-shadow: 0 0 16px rgba(0, 240, 255, 0.4); }
    #hud { font: 800 14px 'Orbitron', monospace; color: #00f0ff; letter-spacing: 1px; background: rgba(8, 12, 22, 0.7); padding: 4px 16px; border-radius: 999px; border: 1px solid rgba(0, 240, 255, 0.3); }
    canvas { background: #070a12; border: 1px solid rgba(0, 240, 255, 0.3); border-radius: 16px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 240, 255, 0.15); max-width: 96vw; max-height: 72vh; }
    #bar { display: flex; gap: 12px; align-items: center; background: rgba(12, 18, 30, 0.85); padding: 10px 18px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.14); backdrop-filter: blur(12px); }
    button { background: rgba(255, 255, 255, 0.08); color: #e8ecf2; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; padding: 6px 14px; font: 800 12px 'Orbitron', sans-serif; cursor: pointer; transition: all 0.15s ease; }
    button:hover { background: #00f0ff; color: #05070c; border-color: #00f0ff; box-shadow: 0 0 12px rgba(0, 240, 255, 0.4); }
    input[type=range] { width: min(50vw, 360px); accent-color: #00f0ff; cursor: pointer; }
    a { background: linear-gradient(135deg, #00f0ff, #0284c7); color: #05070c; text-decoration: none; font: 900 12px 'Orbitron', sans-serif; letter-spacing: 1px; padding: 7px 16px; border-radius: 999px; box-shadow: 0 0 14px rgba(0, 240, 255, 0.4); transition: all 0.15s ease; }
    a:hover { transform: translateY(-1px); box-shadow: 0 0 20px rgba(0, 240, 255, 0.6); }
    #err { color: #ff2e54; font-size: 13px; font-weight: 700; }
  </style>
</head>
<body>
  <div id="wrap">
    <h1><span data-i18n="ghostReplay">🎥 GHOST REPLAY</span> — <span id="who">…</span></h1>
    <div id="hud">—</div>
    <canvas id="cv" width="900" height="620"></canvas>
    <div id="bar">
      <button id="play">⏸</button>
      <input id="scrub" type="range" min="0" max="1000" value="0"/>
      <button id="spd">×1</button>
      <a id="open-game" href="/" data-i18n="raceThisGhost">🏁 RACE THIS GHOST</a>
    </div>
    <p id="err" hidden></p>
  </div>
  <script src="js/config.js"></script>
  <script src="js/i18n.js?v=100"></script>
  <script src="js/game-core.js?v=100"></script>
  <script src="js/replay.js?v=100"></script>
</body>
</html>
